<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meeting | Platypus</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="meeting-body">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="meeting-title">Platypus Meeting</div>
    <div class="meeting-status">● Live</div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="meeting-main">

    <!-- ACTIVE SPEAKER -->
    <section class="active-speaker">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="name-tag">Participant</div>
    </section>

    <!-- SELF VIEW -->
    <aside class="self-view">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="name-tag">You</div>
    </aside>

  </main>

  <!-- CONTROLS -->
  <footer class="controls-bar">
    <button id="muteBtn">🎤</button>
    <button id="cameraBtn">📷</button>
    <button id="startTranscriptBtn">📝</button>
    <button class="end-call" onclick="window.location.href='dashboard.html'">❌</button>
  </footer>

</body>

</html>
